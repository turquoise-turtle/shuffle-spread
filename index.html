<!doctype html>
<html lang="en-AU">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuffle spread</title>
<link rel="stylesheet" href="style.css">

<h1>Shuffle spread</h1>
<p class="lede">
	Interleaves several podcasts into one running order, spreading each show
	evenly across the whole queue instead of clumping it.
</p>

<section id="input">
	<table id="shows">
		<thead>
			<tr><th class="col-show">Show</th><th class="col-count">Left</th><th class="col-del"><span class="sr">Remove</span></th></tr>
		</thead>
		<tbody></tbody>
	</table>

	<p class="row-actions">
		<button type="button" id="add">Add show</button>
		<button type="button" id="clear" class="quiet">Clear all</button>
	</p>

	<div class="limits">
		<label>Take at most
			<input type="number" id="per-show" min="1" placeholder="all"> per show</label>
		<label>and cap the queue at
			<input type="number" id="total" min="1" placeholder="all"> episodes</label>
	</div>

	<p class="controls">
		<label><input type="checkbox" id="randomise" checked> Randomise (different order each time)</label>
		<button type="button" id="shuffle" class="primary">Shuffle</button>
	</p>
</section>

<section id="output" hidden>
	<h2>Running order <span id="count" class="count"></span></h2>
	<p class="row-actions">
		<button type="button" id="copy">Copy</button>
		<span id="copied" class="copied" hidden>Copied</span>
	</p>
	<ol id="result"></ol>
</section>

<script src="main.js"></script>
</html>
